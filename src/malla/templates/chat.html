{% extends "base.html" %}

{% block title %}Chat - {{ APP_NAME }}{% endblock %}

{% block content %}
<div class="container-fluid py-3">
    <div class="d-flex align-items-center mb-3">
        <div>
            <h2 class="mb-0">Chat</h2>
            <small class="text-muted">Live text messages from the mesh.</small>
        </div>
        <div class="ms-auto d-flex align-items-center gap-3">
            <span class="badge bg-success" id="chat-status">Live</span>
            <span class="text-muted small">Messages: <span id="chat-count">0</span></span>
        </div>
    </div>

    <!-- Mini-map showing chat nodes -->
    <div class="card mb-3" id="chat-minimap-card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h6 class="mb-0">Node Map</h6>
            <button class="btn btn-sm btn-link p-0" id="toggle-minimap" title="Toggle map">
                <i class="bi bi-chevron-up"></i>
            </button>
        </div>
        <div class="card-body p-0" id="chat-minimap-body">
            <div id="chat-minimap" style="height: 300px; width: 100%;"></div>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="row g-2 mb-3">
                <div class="col-sm-4 col-md-3 col-lg-2">
                    <input type="text" class="form-control form-control-sm" id="filter-text" placeholder="Search text...">
                </div>
                <div class="col-sm-4 col-md-3 col-lg-2">
                    <input type="text" class="form-control form-control-sm" id="filter-from" placeholder="From node (!abcd1234)">
                </div>
                <div class="col-sm-4 col-md-3 col-lg-2">
                    <select class="form-select form-select-sm" id="filter-limit">
                        <option value="50">Last 50</option>
                        <option value="100">Last 100</option>
                        <option value="250">Last 250</option>
                        <option value="500" selected>Last 500</option>
                    </select>
                </div>
                <div class="col-sm-4 col-md-3 col-lg-2 d-flex gap-2">
                    <button class="btn btn-sm btn-primary" id="chat-refresh">Refresh</button>
                    <button class="btn btn-sm btn-outline-secondary" id="chat-pause">Pause</button>
                </div>
            </div>

            <div id="chat-list" class="chat-list" style="max-height: 70vh; overflow-y: auto;">
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
    #chat-minimap {
        border-radius: 0 0 0.375rem 0.375rem;
    }
    @media (max-width: 768px) {
        #chat-minimap {
            height: 200px !important;
        }
    }
</style>
{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="{{ url_for('static', filename='js/chat.js') }}"></script>
{% endblock %}
