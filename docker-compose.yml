services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meshtastic_history}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    command: postgres -c max_connections=2000
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  malla-web:
    build: .
    image: malla:local

    # Choose between Flask dev server and Gunicorn
    # Default: Flask development server (malla-web)
    # Production: Gunicorn WSGI server (malla-web-gunicorn)
    command: ${MALLA_WEB_COMMAND:-/app/.venv/bin/malla-web}

    ports:
      - "${MALLA_WEB_PORT:-5008}:5008"
    environment:
      - MALLA_SERVICE_TYPE=web
      - MALLA_HOST=0.0.0.0
      - MALLA_PORT=5008
      - MALLA_DATABASE_HOST=postgres
      - MALLA_DATABASE_PORT=5432
      - MALLA_DATABASE_NAME=${POSTGRES_DB:-meshtastic_history}
      - MALLA_DATABASE_USER=${POSTGRES_USER:-postgres}
      - MALLA_DATABASE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - MALLA_DB_POOL_MAX=500
      - MALLA_NAME=${MALLA_NAME:-Malla}
      - MALLA_SECRET_KEY=${MALLA_SECRET_KEY:-dev-secret-key-change-in-production}
      - MALLA_DEBUG=${MALLA_DEBUG:-false}
    volumes:
      - malla_data:/app/data
      # Optional: mount your own config file (uncomment if you have one)
      # - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5008/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy
      malla-capture:
        condition: service_started

  malla-capture:
    image: malla:local
    command: ["/app/.venv/bin/malla-capture"]
    environment:
      - MALLA_SERVICE_TYPE=capture
      - MALLA_DATABASE_HOST=postgres
      - MALLA_DATABASE_PORT=5432
      - MALLA_DATABASE_NAME=${POSTGRES_DB:-meshtastic_history}
      - MALLA_DATABASE_USER=${POSTGRES_USER:-postgres}
      - MALLA_DATABASE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - MALLA_DB_POOL_MAX=500
      # MQTT Configuration - set these in your .env file
      - MALLA_MQTT_BROKER_ADDRESS=${MALLA_MQTT_BROKER_ADDRESS}
      - MALLA_MQTT_PORT=${MALLA_MQTT_PORT:-1883}
      - MALLA_MQTT_USERNAME=${MALLA_MQTT_USERNAME:-}
      - MALLA_MQTT_PASSWORD=${MALLA_MQTT_PASSWORD:-}
      - MALLA_MQTT_TOPIC_PREFIX=${MALLA_MQTT_TOPIC_PREFIX:-msh}
      - MALLA_MQTT_TOPIC_SUFFIX=${MALLA_MQTT_TOPIC_SUFFIX:-/+/+/+/#}
      - MALLA_DEFAULT_CHANNEL_KEY=${MALLA_DEFAULT_CHANNEL_KEY:-}
      - MALLA_IGNORED_NODE_IDS=${MALLA_IGNORED_NODE_IDS:-}
      - MALLA_IGNORE_MALFORMED_PACKETS=${MALLA_IGNORE_MALFORMED_PACKETS:-true}
      - MALLA_METRICS_ENABLED=${MALLA_METRICS_ENABLED:-true}
      - MALLA_METRICS_PORT=9100
      - MALLA_DATA_RETENTION_HOURS=${MALLA_DATA_RETENTION_HOURS:-24}
    volumes:
      - malla_data:/app/data
      # Optional: mount your own config file (uncomment if you have one)
      # - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/metrics').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  malla_data:
  postgres_data:
